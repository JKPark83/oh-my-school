# Phase 4 에서 생긴 첫 의존성. 세션 락을 직접 짜지 않기 위한 것이다.
# 같은 유저의 프로필을 두 서버가 동시에 쓰면 진행도가 사라진다.
#
# ProfileStore 는 realm 이 server 다. 클라이언트로 복제되면 안 되므로
# [dependencies] 가 아니라 [server-dependencies] 에 둔다.
[package]
name = "jkpark/oh-my-school"
version = "0.1.0"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"

[server-dependencies]
ProfileStore = "lm-loleris/profilestore@1.0.3"
