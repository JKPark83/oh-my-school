<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1920px; height:1080px; overflow:hidden; background:#05070a; }
  .stage { position:relative; width:1920px; height:1080px; overflow:hidden;
           font-family:"Apple SD Gothic Neo", sans-serif; }
  .half { position:absolute; top:0; height:1080px; }
  .left  { left:0;  width:1010px;
    background: radial-gradient(90% 90% at 40% 40%, #17384a 0%, #0d2130 55%, #060e15 100%);
    clip-path: polygon(0 0, 100% 0, 78% 100%, 0 100%); }
  .right { right:0; width:1010px;
    background: radial-gradient(90% 90% at 60% 38%, #4a1a1f 0%, #2a0f14 55%, #120609 100%);
    clip-path: polygon(22% 0, 100% 0, 100% 100%, 0 100%); }
  .seam { position:absolute; top:-40px; left:865px; width:26px; height:1160px;
    background:linear-gradient(#ff5a63, #ff2b3a); transform:rotate(11.6deg);
    box-shadow:0 0 60px 18px rgba(255,43,58,.55); }
  .grain { position:absolute; inset:0;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.022) 0 2px, transparent 2px 4px); }
  .vignette { position:absolute; inset:0; z-index:40; pointer-events:none;
    background: radial-gradient(110% 95% at 50% 45%, transparent 40%, rgba(0,0,0,.8) 100%); }
  svg { display:block; overflow:visible; }
  .layer { position:absolute; inset:0; }
</style>
</head>
<body>
<div class="stage">
  <div class="half left"></div>
  <div class="half right"></div>
  <div class="seam"></div>
  <div class="grain"></div>

  <svg class="layer" viewBox="0 0 1920 1080">
    <defs>
      <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#f7d3ad"/><stop offset=".62" stop-color="#dcae84"/>
        <stop offset="1" stop-color="#8d6a4f"/></linearGradient>
      <linearGradient id="skinCool" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#d8e6f2"/><stop offset=".45" stop-color="#eccfae"/>
        <stop offset="1" stop-color="#7d6650"/></linearGradient>
      <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#322924"/><stop offset="1" stop-color="#0a0908"/></linearGradient>
      <filter id="redGlow" x="-90%" y="-90%" width="280%" height="280%">
        <feGaussianBlur stdDeviation="14" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="cyanGlow" x="-90%" y="-90%" width="280%" height="280%">
        <feGaussianBlur stdDeviation="14" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="16"/></filter>
    </defs>

    <!-- ========== 학생 (왼쪽) ========== -->
    <g transform="translate(150,236)">
      <!-- 어깨/후드 -->
      <rect x="-40" y="470" width="620" height="380" rx="16" fill="#ffc21f"/>
      <rect x="-40" y="470" width="620" height="14" fill="#fff" opacity=".4"/>
      <rect x="380" y="470" width="200" height="380" fill="#000" opacity=".2"/>
      <!-- 목 -->
      <rect x="180" y="418" width="180" height="70" fill="#b9906c"/>
      <!-- 머리 -->
      <rect x="80" y="60" width="400" height="380" rx="26" fill="url(#skinCool)"/>
      <!-- 앞머리 -->
      <path d="M62 132 q22 -108 218 -108 q196 0 218 108 l0 46 l-436 0 z" fill="url(#hair)"/>
      <rect x="62" y="26" width="436" height="120" rx="30" fill="url(#hair)"/>
      <!-- 눈 (겁먹은, 크게) -->
      <g>
        <rect x="140" y="214" width="96" height="86" rx="14" fill="#f4f7fa"/>
        <rect x="322" y="214" width="96" height="86" rx="14" fill="#f4f7fa"/>
        <rect x="170" y="238" width="44" height="46" rx="12" fill="#141b21"/>
        <rect x="352" y="238" width="44" height="46" rx="12" fill="#141b21"/>
        <rect x="180" y="246" width="16" height="16" rx="6" fill="#fff"/>
        <rect x="362" y="246" width="16" height="16" rx="6" fill="#fff"/>
      </g>
      <!-- 눈썹 (걱정) -->
      <rect x="136" y="184" width="104" height="16" rx="8" fill="#251d16" transform="rotate(-7 188 192)"/>
      <rect x="318" y="184" width="104" height="16" rx="8" fill="#251d16" transform="rotate(7 370 192)"/>
      <!-- 입 (앙다문) -->
      <rect x="228" y="348" width="106" height="26" rx="12" fill="#8f5346"/>
      <!-- 식은땀 -->
      <g fill="#8fe8ff" opacity=".92" filter="url(#cyanGlow)">
        <path d="M452 150 q26 44 26 62 a26 26 0 0 1 -52 0 q0 -18 26 -62 z"/>
      </g>
      <!-- 시안 림라이트 -->
      <g filter="url(#cyanGlow)" opacity=".9">
        <rect x="74" y="60" width="12" height="380" rx="6" fill="#5df0ff"/>
        <rect x="-46" y="470" width="12" height="380" rx="6" fill="#5df0ff"/>
      </g>
    </g>

    <!-- ========== 선생님 (오른쪽) ========== -->
    <g transform="translate(1130,180)">
      <!-- 어깨/정장 -->
      <rect x="30" y="520" width="700" height="400" rx="16" fill="#26313f"/>
      <rect x="30" y="520" width="700" height="12" fill="#5c7091" opacity=".55"/>
      <path d="M330 520 L380 606 L430 520 Z" fill="#e9eef5"/>
      <path d="M372 592 L406 620 L382 780 L356 620 Z" fill="#c0242f"/>
      <rect x="470" y="520" width="260" height="400" fill="#000" opacity=".22"/>
      <!-- 목 -->
      <rect x="300" y="470" width="170" height="70" fill="#a87f5e"/>
      <!-- 머리 -->
      <rect x="150" y="80" width="440" height="410" rx="26" fill="url(#skin)"/>
      <rect x="460" y="80" width="130" height="410" fill="#000" opacity=".16"/>
      <!-- 머리카락 -->
      <path d="M132 172 q24 -116 238 -116 q214 0 238 116 l0 40 l-476 0 z" fill="url(#hair)"/>
      <rect x="132" y="46" width="476" height="130" rx="32" fill="url(#hair)"/>
      <!-- 안경 -->
      <g stroke="#e8eef5" stroke-width="14" fill="#0a0e13" fill-opacity=".45">
        <rect x="182" y="228" width="170" height="122" rx="20"/>
        <rect x="392" y="228" width="170" height="122" rx="20"/>
      </g>
      <rect x="352" y="278" width="40" height="14" fill="#e8eef5"/>
      <!-- 붉은 눈 -->
      <g filter="url(#redGlow)">
        <rect x="212" y="266" width="112" height="42" rx="12" fill="#ff2b3a"/>
        <rect x="422" y="266" width="112" height="42" rx="12" fill="#ff2b3a"/>
      </g>
      <!-- 찌푸린 눈썹 -->
      <rect x="176" y="196" width="180" height="22" rx="11" fill="#1a1512" transform="rotate(9 266 207)"/>
      <rect x="388" y="196" width="180" height="22" rx="11" fill="#1a1512" transform="rotate(-9 478 207)"/>
      <!-- 호통치는 입 -->
      <rect x="288" y="392" width="164" height="62" rx="18" fill="#4a2122"/>
      <rect x="288" y="392" width="164" height="16" rx="8" fill="#f0eae4" opacity=".85"/>
      <!-- 붉은 림라이트 -->
      <g filter="url(#redGlow)" opacity=".85">
        <rect x="144" y="80" width="12" height="410" rx="6" fill="#ff3b48"/>
        <rect x="24" y="520" width="12" height="400" rx="6" fill="#ff3b48"/>
      </g>
    </g>
  </svg>

  <!-- ========== 타이포 ========== -->
  <svg class="layer" viewBox="0 0 1920 1080" style="z-index:35">
    <g font-family="Apple SD Gothic Neo" font-weight="900" paint-order="stroke" stroke-linejoin="round" text-anchor="middle">
      <text x="960" y="812" font-size="300" fill="#ffffff" stroke="#0b0f13" stroke-width="34" letter-spacing="-12">얼음<tspan fill="#ff2b3a">!</tspan></text>
      <text x="960" y="812" font-size="300" fill="#ffffff" letter-spacing="-12">얼음<tspan fill="#ff2b3a">!</tspan></text>
      <text x="960" y="940" font-size="140" fill="#ffd63d" stroke="#0b0f13" stroke-width="26" letter-spacing="-4">6학년</text>
      <text x="960" y="940" font-size="140" fill="#ffd63d" letter-spacing="-4">6학년</text>
    </g>
    <g transform="translate(560,986)">
      <rect x="0" y="0" width="800" height="72" rx="10" fill="#0b100f" opacity=".85"/>
      <rect x="0" y="0" width="12" height="72" rx="6" fill="#ff2b3a"/>
      <text x="400" y="51" text-anchor="middle" font-family="Apple SD Gothic Neo" font-weight="800"
            font-size="44" fill="#eef4ef" letter-spacing="-1">교실 72개, 몰래 앉아 졸업하라</text>
    </g>
    <g transform="translate(1444,44) rotate(3)">
      <rect x="0" y="0" width="392" height="94" rx="18" fill="#ff2b3a"/>
      <rect x="0" y="86" width="392" height="12" rx="6" fill="#8d0c16"/>
      <text x="196" y="64" text-anchor="middle" font-family="Apple SD Gothic Neo" font-weight="900"
            font-size="46" fill="#fff" letter-spacing="-1">한 판 1분</text>
    </g>
  </svg>

  <div class="vignette"></div>
</div>
</body>
</html>
