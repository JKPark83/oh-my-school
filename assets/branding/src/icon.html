<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:512px; height:512px; overflow:hidden; background:#000; }
  .stage { position:relative; width:512px; height:512px; overflow:hidden;
           font-family:"Apple SD Gothic Neo", sans-serif; }
  .bg { position:absolute; inset:0;
    background: radial-gradient(80% 75% at 50% 34%, #35604e 0%, #1f3f34 52%, #0e211d 100%); }
  .bg::after { content:""; position:absolute; inset:0;
    background:
      repeating-linear-gradient(112deg, rgba(255,255,255,.05) 0 2px, transparent 2px 22px),
      repeating-linear-gradient(64deg, rgba(255,255,255,.035) 0 2px, transparent 2px 28px); }
  .frame { position:absolute; inset:0; border:14px solid #8f6d45; border-radius:2px; z-index:30; }
  .vignette { position:absolute; inset:0; z-index:25; pointer-events:none;
    background: radial-gradient(88% 82% at 50% 42%, transparent 42%, rgba(0,0,0,.72) 100%); }
  svg { display:block; overflow:visible; position:absolute; inset:0; }
</style>
</head>
<body>
<div class="stage">
  <div class="bg"></div>

  <svg viewBox="0 0 512 512">
    <defs>
      <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#f7d3ad"/><stop offset=".6" stop-color="#dcae84"/>
        <stop offset="1" stop-color="#8d6a4f"/></linearGradient>
      <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#332a25"/><stop offset="1" stop-color="#0a0908"/></linearGradient>
      <filter id="redGlow" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="10" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="drop" x="-40%" y="-40%" width="180%" height="180%">
        <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".65"/></filter>
    </defs>

    <g filter="url(#drop)">
      <!-- 어깨 -->
      <rect x="52" y="374" width="408" height="150" rx="12" fill="#26313f"/>
      <rect x="52" y="374" width="408" height="8" fill="#5c7091" opacity=".55"/>
      <path d="M222 374 L256 434 L290 374 Z" fill="#e9eef5"/>
      <path d="M250 424 L272 444 L258 512 L242 444 Z" fill="#c0242f"/>
      <rect x="330" y="374" width="130" height="150" fill="#000" opacity=".22"/>
      <!-- 목 -->
      <rect x="214" y="338" width="90" height="46" fill="#a87f5e"/>
      <!-- 머리 -->
      <rect x="122" y="74" width="272" height="270" rx="18" fill="url(#skin)"/>
      <rect x="318" y="74" width="76" height="270" fill="#000" opacity=".16"/>
      <path d="M110 136 q14 -76 148 -76 q134 0 148 76 l0 26 l-296 0 z" fill="url(#hair)"/>
      <rect x="110" y="52" width="296" height="86" rx="20" fill="url(#hair)"/>
      <!-- 안경 -->
      <g stroke="#e8eef5" stroke-width="10" fill="#0a0e13" fill-opacity=".45">
        <rect x="140" y="172" width="110" height="80" rx="14"/>
        <rect x="272" y="172" width="110" height="80" rx="14"/>
      </g>
      <rect x="250" y="204" width="24" height="10" fill="#e8eef5"/>
      <!-- 붉은 눈 -->
      <g filter="url(#redGlow)">
        <rect x="160" y="198" width="72" height="28" rx="9" fill="#ff2b3a"/>
        <rect x="292" y="198" width="72" height="28" rx="9" fill="#ff2b3a"/>
      </g>
      <!-- 눈썹 -->
      <rect x="136" y="150" width="116" height="16" rx="8" fill="#1a1512" transform="rotate(9 194 158)"/>
      <rect x="266" y="150" width="116" height="16" rx="8" fill="#1a1512" transform="rotate(-9 324 158)"/>
      <!-- 입 -->
      <rect x="212" y="282" width="98" height="38" rx="12" fill="#4a2122"/>
      <rect x="212" y="282" width="98" height="10" rx="5" fill="#f0eae4" opacity=".85"/>
    </g>

    <!-- 타이틀 -->
    <g font-family="Apple SD Gothic Neo" font-weight="900" paint-order="stroke"
       stroke-linejoin="round" text-anchor="middle">
      <text x="256" y="470" font-size="122" fill="#ffffff" stroke="#0b0f13" stroke-width="22" letter-spacing="-6">얼음<tspan fill="#ff2b3a">!</tspan></text>
      <text x="256" y="470" font-size="122" fill="#ffffff" letter-spacing="-6">얼음<tspan fill="#ff2b3a">!</tspan></text>
    </g>
  </svg>

  <div class="vignette"></div>
  <div class="frame"></div>
</div>
</body>
</html>
