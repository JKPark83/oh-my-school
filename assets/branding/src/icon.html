<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!--
  게임 아이콘 512×512. 모티프 하나: 학교 앞에서 「교장」 명패 뒤에 선 꼬마 교장.
  명패 두 글자가 100px 로 줄어도 읽히도록 크게 둔다. 로블록스가 모서리를 둥글게 자르므로
  중요한 것은 가장자리 40px 안쪽에 둔다.
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:512px; height:512px; overflow:hidden; background:#8fd6ff; }
  svg { display:block; }
</style>
<script src="kit.js"></script>
</head>
<body>
<svg id="art" width="512" height="512" viewBox="0 0 512 512"></svg>
<script>
const K = KIT, OL = K.OL;
const win = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" fill="#8fd3ff" stroke="${OL}" stroke-width="4"/>
  <path d="M ${x + 6} ${y + h - 8} L ${x + w - 10} ${y + 6}" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".6"/>`;

let g = `<defs>${K.defs}
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4fb8ff"/><stop offset=".7" stop-color="#a9e2ff"/><stop offset="1" stop-color="#d6f2ff"/></linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset=".55" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d99a5b"/><stop offset="1" stop-color="#b87436"/></linearGradient>
  <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff3a8"/><stop offset=".5" stop-color="#ffd23f"/><stop offset="1" stop-color="#f2a516"/></linearGradient>
</defs>`;

// 하늘
g += `<rect width="512" height="512" fill="url(#sky)"/>`;
g += `<circle cx="256" cy="230" r="250" fill="url(#glow)"/>`;
// 구름
g += `<g fill="#fff" opacity=".95">
  <ellipse cx="70" cy="64" rx="46" ry="20"/><circle cx="58" cy="54" r="20"/><circle cx="86" cy="48" r="24"/>
  <ellipse cx="448" cy="58" rx="42" ry="17"/><circle cx="438" cy="48" r="17"/><circle cx="462" cy="44" r="20"/></g>`;

// 학교: 왼쪽 시계탑 동, 오른쪽 깃발 동
g += `<g>
  <rect x="-10" y="226" width="200" height="230" fill="#fff1d6" stroke="${OL}" stroke-width="6"/>
  <rect x="322" y="226" width="200" height="230" fill="#fff1d6" stroke="${OL}" stroke-width="6"/>
  <rect x="-16" y="212" width="212" height="26" rx="8" fill="#ff9b54" stroke="${OL}" stroke-width="6"/>
  <rect x="316" y="212" width="212" height="26" rx="8" fill="#ff9b54" stroke="${OL}" stroke-width="6"/>
  ${win(14, 256, 40, 44)}${win(66, 256, 40, 44)}${win(360, 256, 40, 44)}${win(412, 256, 40, 44)}${win(464, 256, 40, 44)}
  ${win(14, 320, 40, 44)}${win(66, 320, 40, 44)}${win(412, 320, 40, 44)}${win(464, 320, 40, 44)}
  <rect x="30" y="118" width="112" height="100" fill="#fff1d6" stroke="${OL}" stroke-width="6"/>
  <path d="M 20 124 L 86 76 L 152 124 Z" fill="#ff9b54" stroke="${OL}" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="86" cy="168" r="34" fill="#fff" stroke="${OL}" stroke-width="6"/>
  <path d="M 86 168 L 86 146 M 86 168 L 102 176" stroke="${OL}" stroke-width="6" stroke-linecap="round"/>
  <circle cx="86" cy="168" r="4" fill="${OL}"/>
  <rect x="416" y="100" width="7" height="116" rx="3" fill="#8a93a8" stroke="${OL}" stroke-width="3"/>
  <path d="M 423 106 Q 448 98 470 108 L 470 146 Q 448 136 423 144 Z" fill="#ffd43b" stroke="${OL}" stroke-width="5" stroke-linejoin="round"/>
  ${K.star(446, 125, 11, '#fff')}
</g>`;
// 잔디 띠
g += `<rect x="-10" y="404" width="532" height="120" fill="#6fdc8c"/>`;

// 꼬마 교장
g += `<g transform="translate(256 515) scale(1.32)">${K.chibi({
  cowlick: true, outfit: 'blazer', top: '#2f3f7a', acc: ['bowtie:#ffcf3a', 'badge'],
  mouth: 'grin', armL: 128, armR: 128, shadow: false,
})}</g>`;

// 반짝임
g += K.sparkle(438, 196, 20, '#fff') + K.sparkle(66, 262, 14, '#fff') + K.sparkle(468, 330, 11, '#fff', .9);

// 책상 + 명패
g += `<rect x="-10" y="468" width="532" height="60" fill="url(#wood)" stroke="${OL}" stroke-width="6"/>
  <rect x="-10" y="468" width="532" height="9" fill="#fff" opacity=".25"/>
  <g>
    <path d="M 104 484 L 118 388 L 394 388 L 408 484 Z" fill="#8a5424" stroke="${OL}" stroke-width="7" stroke-linejoin="round"/>
    <path d="M 122 474 L 132 400 L 380 400 L 390 474 Z" fill="url(#plate)" stroke="#b97a12" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 140 408 L 372 408" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".7"/>
    <text x="256" y="465" text-anchor="middle" font-family="Apple SD Gothic Neo" font-weight="900" font-size="80"
          letter-spacing="14" fill="${OL}">교장</text>
  </g>`;

document.getElementById('art').innerHTML = g;
</script>
</body>
</html>
